# Continuous integration: build and test on every pull request.
#
# Deployment is deliberately NOT automated here; it stays a manual CLI process
# (see README.md, "Manual deployment from a repository clone"). This workflow
# only answers "does the proposed change build and pass its tests?".
name: CI

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes any run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The function app targets .NET 10 (isolated worker).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Restore the function app project directly, then the test project. Azure.Functions.Sdk
      # generates its extensions helper project during restore of the function project itself;
      # restoring only a solution or a referencing project skips that hook (warning AZFW0108).
      - name: Restore
        run: |
          dotnet restore src/AzureDdns.FunctionApp/AzureDdns.FunctionApp.csproj
          dotnet restore tests/AzureDdns.FunctionApp.Tests/AzureDdns.FunctionApp.Tests.csproj

      - name: Build
        run: dotnet build tests/AzureDdns.FunctionApp.Tests/AzureDdns.FunctionApp.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/AzureDdns.FunctionApp.Tests/AzureDdns.FunctionApp.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Validates that the infrastructure templates compile (syntax, types, module references).
  # This does not deploy or contact Azure: `az bicep build` is a purely local compile.
  # The Azure CLI and Bicep are available on GitHub-hosted Ubuntu runners; the Bicep CLI
  # is fetched on first use.
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep templates
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  # Runs the Unifi gateway client end to end under the software the gateways ship: CPython 2.7.18 and
  # curl 7.74.0 (Debian bullseye), against a local HTTPS server that plays the DDNS API. See the header of
  # scripts/test-unifi-client.sh. The container installs its packages from Debian's pinned snapshot archive
  # because bullseye is end-of-life.
  unifi-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Test Unifi client (Python 2.7.18, curl 7.74.0)
        run: |
          docker run --rm \
            -v "$PWD/unifi-client:/client:ro" \
            -v "$PWD/scripts:/scr:ro" \
            debian:bullseye-slim sh /scr/test-unifi-client.sh
